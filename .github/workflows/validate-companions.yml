name: Validate matched build bundles

on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/manual-release.yml'
      - '.github/workflows/validate-companions.yml'
      - 'scripts/companion_artifacts.py'
      - 'scripts/package_nomount.sh'
      - 'scripts/prepare_bundle_release.py'
      - 'tests/test_companion_artifacts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test source pairing and release completeness
        run: python3 -m unittest discover -s tests -p 'test_companion_artifacts.py' -v
      - name: Check NoMount packaging shell syntax
        run: bash -n scripts/package_nomount.sh
