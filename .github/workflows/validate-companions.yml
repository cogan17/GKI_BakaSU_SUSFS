name: Validate matched build bundles

on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/manual-release.yml'
      - '.github/workflows/validate-companions.yml'
      - 'scripts/companion_artifacts.py'
      - 'scripts/upstream_compat_notice.py'
      - 'scripts/package_nomount.sh'
      - 'scripts/prepare_bundle_release.py'
      - 'tests/test_companion_artifacts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test source pairing and release completeness
        run: python3 -m unittest discover -s tests -p 'test_companion_artifacts.py' -v
      - name: Validate upstream report generator
        run: |
          python3 -m py_compile scripts/upstream_compat_notice.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from upstream_compat_notice import BuildContext, render_report
          ctx = BuildContext("cogan17/GKI_BakaSU_SUSFS",
                             "https://github.com/cogan17/GKI_BakaSU_SUSFS/actions/runs/123",
                             "android14-6.1.177-lts-r9", "a" * 40, "35224",
                             "gki-android14-6.1", "b" * 40)
          body = render_report(ctx)
          assert "Bahasa Indonesia" in body
          assert "Copy bug report — BakaSU developers" in body
          assert "Copy bug report — SUSFS (simonpunk)" in body
          assert "I am not assuming" in body
          assert body.count("actions/runs/123") == 3
          print("Upstream bilingual report smoke test passed")
          PY
      - name: Check NoMount packaging shell syntax
        run: bash -n scripts/package_nomount.sh
