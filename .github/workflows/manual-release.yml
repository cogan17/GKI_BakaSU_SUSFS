name: Manual Release From Run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build run ID
        required: true
        type: string
      release_type:
        description: Release type
        type: choice
        options:
          - Pre-Release
          - Release
        default: Pre-Release

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: cogan-release-${{ inputs.source_run_id }}
      cancel-in-progress: false
    steps:
      - name: Verify official Cogan release repository
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          if [[ "$REPOSITORY" != "cogan17/GKI_BakaSU_SUSFS" ||
                "$REPOSITORY_ID" != "1397614374" ||
                "$OWNER_ID" != "79615344" ]]; then
            echo "::error title=Official Cogan releases only::Forks cannot publish through the official release workflow."
            exit 1
          fi

      - name: Check out release verification scripts
        uses: actions/checkout@v6

      - name: Check build
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid Run ID"; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          result="$(jq -r '.conclusion // ""' <<< "$run_json")"
          [[ "$result" == "success" ]] || { echo "::error::Build was not successful: $result"; exit 1; }
          source_repo="$(jq -r '.head_repository.full_name // ""' <<< "$run_json")"
          [[ "$source_repo" == "$GITHUB_REPOSITORY" ]] || { echo "::error::Build is from another repository"; exit 1; }
          workflow_path="$(jq -r '.path // ""' <<< "$run_json")"
          case "$workflow_path" in
            .github/workflows/kernel-custom.yml|.github/workflows/main.yml) ;;
            *) echo "::error::Not a supported kernel build workflow: $workflow_path"; exit 1 ;;
          esac
          echo "sha=$(jq -r '.head_sha' <<< "$run_json")" >> "$GITHUB_OUTPUT"
          sha="$(jq -r '.head_sha' <<< "$run_json")"
          tree_json="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$sha?recursive=1")"
          [[ "$(jq -r '.truncated' <<< "$tree_json")" == false ]] || exit 1
          echo "require_bundle=$(jq -r 'any(.tree[]; .path == "scripts/companion_artifacts.py")' <<< "$tree_json")" >> "$GITHUB_OUTPUT"

      - name: Download original artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id }}
          pattern: '*'
          path: downloaded-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-decompress: true

      - name: Verify complete matched bundle (or legacy kernel-only run)
        id: package
        env:
          RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REQUIRE_BUNDLE: ${{ steps.source.outputs.require_bundle }}
        run: |
          set -euo pipefail
          args=()
          if [ "$REQUIRE_BUNDLE" = true ]; then args+=(--require-bundle); fi
          python3 scripts/prepare_bundle_release.py downloaded-artifacts release-files \
            --run-id "$RUN_ID" --workflow-commit "$SOURCE_SHA" "${args[@]}"
          echo "title=Cogan - build $RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check previous release state to avoid duplicate announcements
        id: previous_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          tag="BakaSU-run-${SOURCE_RUN_ID}"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > prior-release.json 2>/dev/null; then
            prior_type="$(jq -r 'if .prerelease then "Pre-Release" else "Release" end' prior-release.json)"
            echo "type=$prior_type" >> "$GITHUB_OUTPUT"
          else
            # A non-existent tag is normal on first publication; publication itself validates access.
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish original matched build files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: BakaSU-run-${{ inputs.source_run_id }}
          name: ${{ steps.package.outputs.title }}
          target_commitish: ${{ steps.source.outputs.sha }}
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          body_path: release-files/release-notes.md
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download link
        run: |
          echo "### Kernel + BakaSU managers + NoMount (when enabled)" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download from Releases]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/BakaSU-run-${{ inputs.source_run_id }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Cogan channel only for new stable or prerelease publication
        if: ${{ steps.previous_release.outputs.type != inputs.release_type && github.run_attempt == 1 }}
        continue-on-error: true
        env:
          COGAN_TELEGRAM_ENABLED: ${{ vars.COGAN_TELEGRAM_ENABLED }}
          COGAN_TELEGRAM_BOT_TOKEN: ${{ secrets.COGAN_TELEGRAM_BOT_TOKEN }}
          COGAN_TELEGRAM_CHANNEL_ID: ${{ secrets.COGAN_TELEGRAM_CHANNEL_ID }}
          COGAN_RELEASE_RUN_ID: ${{ inputs.source_run_id }}
          COGAN_RELEASE_TYPE: ${{ inputs.release_type }}
          COGAN_RELEASE_NAME: ${{ steps.package.outputs.title }}
        run: python3 scripts/telegram_notify.py manual
