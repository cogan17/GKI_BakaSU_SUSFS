name: Publish Ready-to-Flash ZIP

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build run ID
        required: true
        type: string
      release_type:
        description: Release type
        type: choice
        options:
          - Pre-Release
          - Release
        default: Pre-Release

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify successful build
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Run ID must be numeric"; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          result="$(jq -r '.conclusion // ""' <<< "$run_json")"
          [[ "$result" == success ]] || { echo "::error::Source run status: $result"; exit 1; }
          source_repo="$(jq -r '.head_repository.full_name // ""' <<< "$run_json")"
          [[ "$source_repo" == "$GITHUB_REPOSITORY" ]] || { echo "::error::Build belongs to another repository"; exit 1; }
          echo "sha=$(jq -r '.head_sha' <<< "$run_json")" >> "$GITHUB_OUTPUT"
          workflow_path="$(jq -r '.path // ""' <<< "$run_json")"
          case "$workflow_path" in
            .github/workflows/kernel-custom.yml|.github/workflows/main.yml) ;;
            *) echo "::error::Source must be a supported kernel build workflow ($workflow_path)"; exit 1 ;;
          esac

      - name: Download original ZIP
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id }}
          # New direct ZIP artifacts and legacy wrapped artifacts
          pattern: '*'
          path: downloaded-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate original AnyKernel3 ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # Direct artifacts contain the ready-to-flash ZIP. Older artifacts contain
          # that ZIP inside the Actions artifact container, extracted by this action.
          mapfile -d '' archives < <(find downloaded-artifacts -type f -name '*AnyKernel3.zip' -print0)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one AnyKernel3 ZIP, found ${#archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          unzip -tq "$archive" > /dev/null
          entries="$(unzip -Z -1 "$archive")"
          grep -Fxq 'anykernel.sh' <<< "$entries" || { echo "::error::Missing anykernel.sh"; exit 1; }
          grep -Fxq 'Image' <<< "$entries" || { echo "::error::Missing Image"; exit 1; }
          mkdir -p release-files
          cp -- "$archive" "release-files/$(basename "$archive")"
          echo "title=$(basename "$archive" -AnyKernel3.zip)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: BakaSU-run-${{ inputs.source_run_id }}
          name: ${{ steps.package.outputs.title }}
          target_commitish: ${{ steps.source.outputs.sha }}
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          body: |
            Original AnyKernel3 ZIP from successful build run #${{ inputs.source_run_id }}.
            Unmodified package. Back up your boot image and verify device compatibility before flashing.
          files: release-files/*AnyKernel3.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show direct download link
        run: |
          echo "### Ready-to-flash ZIP" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the original AnyKernel3 ZIP from the [GitHub Release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/BakaSU-run-${{ inputs.source_run_id }})." >> "$GITHUB_STEP_SUMMARY"
          echo "New build artifacts and Release assets are both directly flashable ZIP files." >> "$GITHUB_STEP_SUMMARY"
