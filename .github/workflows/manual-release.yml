name: Manual Release From Run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID dari build yang sukses (Lihat angka di link URL log)'
        required: true
        type: string
      release_type:
        description: 'Tipe Rilis'
        type: choice
        options:
          - Pre-Release
          - Release
        default: Pre-Release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact berdasarkan Run ID
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ inputs.source_run_id }}
          path: downloaded_artifacts

      - name: Repack AnyKernel3 (Siap Flash)
        run: |
          echo "Mencari file anykernel.sh dari artifact hasil Run ID: ${{ inputs.source_run_id }}..."
          AK3_DIR=$(dirname $(find downloaded_artifacts -name "anykernel.sh" | head -n 1))
          
          if [ -z "$AK3_DIR" ] || [ "$AK3_DIR" == "." ]; then
            echo "Error: anykernel.sh tidak ditemukan! Pastikan Run ID benar dan build tersebut sukses."
            exit 1
          fi
          
          echo "Folder AnyKernel3 ditemukan di: $AK3_DIR"
          cd "$AK3_DIR"
          zip -r9 $GITHUB_WORKSPACE/BakaSU-Rothko-GKI-6.1-ReadyToFlash.zip * -x .git README.md *placeholder
          echo "Repack selesai!"

      - name: Atur Label Rilis (Pre-Release / Release)
        id: r_type
        run: |
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publikasi ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: BakaSU-Rothko-${{ inputs.source_run_id }}
          name: GKI 6.1 BakaSU + Re-Kernel (${{ inputs.release_type }})
          prerelease: ${{ steps.r_type.outputs.prerelease == 'true' }}
          body: |
            🚀 **Manual Release from Run ID: ${{ inputs.source_run_id }}**
            - **Tested:** Xiaomi 14T Pro (Rothko)
            - **Kernel:** GKI 6.1.177 BakaSU
            - **Features:** SUSFS + Re-Kernel + ZRAM + BBG + CVE
            
            ✅ *File zip ini sudah di-repack ke format AnyKernel3 asli. Siap di-flash via Kernel Flasher / FKM.*
          files: BakaSU-Rothko-GKI-6.1-ReadyToFlash.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
