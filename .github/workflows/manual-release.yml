name: Manual Release From Run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID dari build yang sukses'
        required: true
        type: string
      release_type:
        description: 'Tipe Rilis'
        type: choice
        options:
          - Pre-Release
          - Release
        default: Pre-Release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact berdasarkan Run ID
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ inputs.source_run_id }}
          path: downloaded_artifacts

      - name: Ekstrak Artifact (Menangani Zip ganda)
        run: |
          echo "Mencari file zip di dalam artifact..."
          cd downloaded_artifacts
          
          # Karena artifact bisa berupa folder berisi zip, atau zip langsung
          # Kita cari semua file .zip
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Tidak ditemukan file .zip di dalam artifact!"
            exit 1
          fi
          
          echo "Ditemukan file ZIP artifact: $ZIP_FILE"
          
          # Buat folder sementara untuk mengekstrak ZIP luar
          mkdir -p extracted_temp
          unzip -q "$ZIP_FILE" -d extracted_temp/
          
          echo "Mencari AnyKernel3 zip di dalam hasil ekstraksi..."
          AK3_ZIP=$(find extracted_temp -name "*AnyKernel3*.zip" | head -n 1)
          
          if [ -n "$AK3_ZIP" ]; then
             echo "Berhasil menemukan AnyKernel3 siap flash: $AK3_ZIP"
             # Pindahkan ke workspace agar mudah dibaca oleh tahap rilis
             mv "$AK3_ZIP" $GITHUB_WORKSPACE/BakaSU-Rothko-GKI-6.1-ReadyToFlash.zip
          else
             echo "Peringatan: Tidak ditemukan file zip dengan nama AnyKernel3 di dalam. Mencoba mencari file Image..."
             # Jika ternyata tidak ada zip di dalam zip, skrip akan berhenti untuk mencegah rilis file yang salah
             exit 1
          fi

      - name: Atur Label Rilis (Pre-Release / Release)
        id: r_type
        run: |
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publikasi ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: BakaSU-Rothko-${{ inputs.source_run_id }}
          name: GKI 6.1 BakaSU + Re-Kernel (${{ inputs.release_type }})
          prerelease: ${{ steps.r_type.outputs.prerelease == 'true' }}
          body: |
            🚀 **Manual Release from Run ID: ${{ inputs.source_run_id }}**
            - **Tested:** Xiaomi 14T Pro (Rothko)
            - **Kernel:** GKI 6.1.177 BakaSU
            - **Features:** SUSFS + Re-Kernel + ZRAM + BBG + CVE
            
            ✅ *File zip ini sudah terekstrak dengan benar dan merupakan AnyKernel3 asli. Siap di-flash via Kernel Flasher / FKM.*
          files: BakaSU-Rothko-GKI-6.1-ReadyToFlash.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
