name: Update GKI Version Data

# Use Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gki-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check data sync logic
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Incrementally update and validate data
        run: python scripts/update_data.py

      - name: Validate all build matrices
        run: |
          python -c 'import sys; sys.path.insert(0, "scripts"); from gki_fetch import TARGETS; from pathlib import Path; missing = [f"{android}/{kernel}" for android, kernel in TARGETS if not Path(f"data/{android}/{kernel}.json").is_file()]; sys.exit("Missing GKI data: " + ", ".join(missing) if missing else 0)'
          for data_file in data/android*/*.json; do
            python scripts/prepare_matrix.py "$data_file" > /dev/null
          done

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/android*/*.json
          if git diff --cached --quiet; then
            echo "No changes to GKI version data."
            exit 0
          fi
          git commit -m "chore: update GKI kernel version data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
