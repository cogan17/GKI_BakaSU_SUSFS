name: Send Telegram Bot Notification

on:
  workflow_dispatch:
    inputs:
      msg_type:
        description: Notification type
        type: string
        default: notice
        required: true
      content:
        description: Notification content
        type: string
        required: true

permissions:
  contents: read

jobs:
  send-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notification sender
        uses: actions/checkout@v4
      - name: Send official Cogan notification (opt-in)
        env:
          COGAN_TELEGRAM_ENABLED: ${{ vars.COGAN_TELEGRAM_ENABLED }}
          COGAN_TELEGRAM_BOT_TOKEN: ${{ secrets.COGAN_TELEGRAM_BOT_TOKEN }}
          COGAN_TELEGRAM_CHANNEL_ID: ${{ secrets.COGAN_TELEGRAM_CHANNEL_ID }}
          COGAN_TELEGRAM_GROUP_ID: ${{ secrets.COGAN_TELEGRAM_GROUP_ID }}
          COGAN_TELEGRAM_GROUP_THREAD_ID: ${{ secrets.COGAN_TELEGRAM_GROUP_THREAD_ID }}
          COGAN_NOTICE_TYPE: ${{ inputs.msg_type }}
          COGAN_NOTICE_CONTENT: ${{ inputs.content }}
        run: python3 scripts/telegram_notify.py notice
